name: Build N971N HWH5 CruelKernel

on:
  workflow_dispatch:
  push:
    branches:
      - cruel-HVJ5-v5.3
    paths:
      - "cruelbuild"
      - "cruel/**"
      - "arch/arm64/configs/**"
      - "kernel/configs/**"
      - "usr/magisk/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

env:
  MODEL: N971N
  TOOLCHAIN: cruel
  PATCH_LEVEL: 2023-08
  KERNEL_NAME: N971N-HWH5-Test1

jobs:
  build:
    name: Build SM-N971N
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            curl \
            wget \
            unzip \
            xz-utils \
            p7zip-full

          sudo apt-get install -y libtinfo5 || true

      - name: Verify N971N source files
        run: |
          echo "===== N971N model entry ====="
          grep -A3 -B3 "'N971N'" cruelbuild

          echo
          echo "===== N971N defconfig ====="
          test -f arch/arm64/configs/exynos9820-d1xks_defconfig
          ls -lh arch/arm64/configs/exynos9820-d1xks_defconfig

          echo
          echo "===== N971N boot header ====="
          test -f cruel/build.mkbootimg.N971N
          cat cruel/build.mkbootimg.N971N

          grep -q "os_patch_level=2023-08" cruel/build.mkbootimg.N971N
          grep -q "board=SRPSD23A002KU" cruel/build.mkbootimg.N971N

      - name: Configure kernel
        run: |
          set -e
          set -o pipefail

          ./cruelbuild config \
            model="${MODEL}" \
            name="${KERNEL_NAME}" \
            os_patch_level="${PATCH_LEVEL}" \
            toolchain="${TOOLCHAIN}" \
            +magisk=v27.2-kitsune-4 \
            2>&1 | tee config.info

      - name: Download Cruel toolchain
        run: |
          rm -rf toolchain

          git clone \
            --depth 1 \
            --branch "${TOOLCHAIN}" \
            --single-branch \
            https://github.com/CruelKernel/samsung-exynos9820-toolchain \
            toolchain

      - name: Build kernel
        run: |
          ./cruelbuild :build

      - name: Install mkbootimg
        run: |
          wget -q \
            https://android.googlesource.com/platform/system/tools/mkbootimg/+archive/refs/heads/master.tar.gz \
            -O mkbootimg.tar.gz

          tar xzf mkbootimg.tar.gz mkbootimg.py gki

          chmod +x mkbootimg.py

          sudo mv mkbootimg.py /usr/local/bin/mkbootimg

          python_site="$(python -c 'import site; print(site.getsitepackages()[0])')"
          sudo mv gki "${python_site}/"

      - name: Install mkdtboimg
        run: |
          wget -q \
            https://android.googlesource.com/platform/system/libufdt/+archive/refs/heads/master.tar.gz \
            -O libufdt.tar.gz

          tar --strip-components 2 \
            -xzf libufdt.tar.gz \
            utils/src/mkdtboimg.py

          chmod +x mkdtboimg.py
          sudo mv mkdtboimg.py /usr/local/bin/mkdtboimg

      - name: Install avbtool
        run: |
          wget -q \
            https://android.googlesource.com/platform/external/avb/+archive/refs/heads/master.tar.gz \
            -O avb.tar.gz

          tar xzf avb.tar.gz avbtool.py

          chmod +x avbtool.py
          sudo mv avbtool.py /usr/local/bin/avbtool

      - name: Create boot image
        run: |
          ./cruelbuild :mkimg

      - name: Verify generated boot image
        run: |
          set -e

          test -f boot.img

          echo "===== Generated files ====="
          ls -lh *.img || true

          echo
          echo "===== boot.img ====="
          stat boot.img

          echo
          echo "===== SHA256 ====="
          sha256sum boot.img | tee SHA256SUMS.txt

          echo
          echo "===== Build config ====="
          cat config.info

          BOOT_SIZE="$(stat -c%s boot.img)"

          echo
          echo "Generated boot.img size: ${BOOT_SIZE} bytes"

          # HWH5 stock boot partition image supplied from SM-N971N:
          # 0x03700000 = 57,671,680 bytes
          if [ "${BOOT_SIZE}" -gt 57671680 ]; then
            echo "ERROR: boot.img exceeds the stock boot partition size"
            exit 1
          fi

      - name: Save build information
        run: |
          {
            echo "Model=${MODEL}"
            echo "Firmware=N971NKSU2HWH5"
            echo "Android=12"
            echo "SecurityPatch=2023-08"
            echo "Board=SRPSD23A002KU"
            echo "KernelName=${KERNEL_NAME}"
            echo "Toolchain=${TOOLCHAIN}"
            echo "Magisk=v23.0"
            echo "GitCommit=${GITHUB_SHA}"
            echo
            sha256sum boot.img
          } > build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: N971N-HWH5-Test1
          path: |
            boot.img
            config.info
            config.N971N
            build-info.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
